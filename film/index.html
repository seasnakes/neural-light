<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Light Switch</title>
<style>
@font-face{font-family:"Noto Serif CJK SC";src:url("fonts/serif-light.otf");font-weight:100 500}
@font-face{font-family:"Noto Sans CJK SC";src:url("fonts/sans.otf");font-weight:100 500}
@font-face{font-family:"Inter";src:url("fonts/inter.ttf");font-weight:100 900}
@font-face{font-family:"TeX Gyre Pagella";src:url("fonts/pagella-italic.otf");font-weight:400;font-style:italic}

:root{
  --ink:#f1ebdf; --gold:#d9b46e; --gold2:#f0d79e; --dim:rgba(226,229,238,.66); --dim2:rgba(226,229,238,.42);
}
html,body{margin:0;width:3840px;height:2160px;overflow:hidden;background:#000}
#gl{position:absolute;left:0;top:0;width:3840px;height:2160px}
#ui{transform:scale(2);transform-origin:0 0;position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;overflow:hidden}
#svg{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.tb{position:absolute;white-space:nowrap;display:none}
.tb.center{text-align:center}
.tb.right{text-align:right}
.ln{display:block}
.ch{display:inline-block;white-space:pre}
.shadow{text-shadow:0 0 28px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.6)}

.kick{font:500 14px/1 "Inter";letter-spacing:.56em;color:var(--gold);text-transform:uppercase;margin-bottom:26px}
.kickzh{font:400 17px/1 "Noto Sans CJK SC";letter-spacing:.5em;color:var(--gold);margin-bottom:24px}
.year{font:200 30px/1 "Inter";letter-spacing:.32em;color:var(--gold2);margin-bottom:24px}
.h1{font:300 54px/1.42 "Noto Serif CJK SC";letter-spacing:.12em;color:var(--ink)}
.h1s{font:300 46px/1.45 "Noto Serif CJK SC";letter-spacing:.12em;color:var(--ink)}
.h1m{font:300 42px/1.5 "Noto Serif CJK SC";letter-spacing:.1em;color:var(--ink)}
.h1b{font:200 96px/1.25 "Noto Serif CJK SC";letter-spacing:.18em;color:var(--ink)}
.hero{font:200 150px/1.1 "Noto Serif CJK SC";letter-spacing:.32em;color:var(--ink);margin-right:-.32em}
.en{font:300 15px/1 "Inter";letter-spacing:.44em;color:var(--dim);text-transform:uppercase;margin-top:26px}
.en2{font:300 14px/1 "Inter";letter-spacing:.4em;color:var(--dim2);text-transform:uppercase;margin-top:16px}
.enq{font:italic 400 26px/1.3 "TeX Gyre Pagella";color:rgba(232,226,212,.78);letter-spacing:.02em;margin-top:18px}
.sci{font:italic 400 30px/1.3 "TeX Gyre Pagella";color:#cfe8d6;letter-spacing:.02em;margin-top:18px}
.sub{font:300 24px/1.6 "Noto Sans CJK SC";letter-spacing:.14em;color:rgba(236,233,226,.84)}
.mono{font:300 13px/1 "Inter";letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.y2026{font:100 132px/1 "Inter";letter-spacing:.06em;background:linear-gradient(180deg,#fff3d6 0%,#e2bd78 48%,#9c7638 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.title{font:300 50px/1 "Noto Serif CJK SC";letter-spacing:.42em;color:var(--ink);margin-right:-.42em}
.titleen{font:300 15px/1 "Inter";letter-spacing:.62em;color:var(--gold);text-transform:uppercase;margin-top:30px;margin-right:-.62em}

.flow{font:300 26px/1 "Noto Sans CJK SC";letter-spacing:.16em;color:rgba(236,233,226,.32)}
.arrow{font:200 22px/1 "Inter";color:rgba(236,233,226,.30);padding:0 26px}

/* callouts */
.cl{position:absolute;white-space:nowrap;display:none;text-shadow:0 0 14px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.8)}
.clzh{font:400 22px/1.2 "Noto Sans CJK SC";letter-spacing:.2em;color:var(--ink)}
.clen{font:400 11.5px/1 "Inter";letter-spacing:.38em;color:var(--gold);text-transform:uppercase;margin-top:9px}
.clsub{font:300 15px/1.3 "Noto Sans CJK SC";letter-spacing:.12em;color:var(--dim);margin-top:9px}

/* laureates */
.lzh{font:400 42px/1 "Noto Serif CJK SC";letter-spacing:.14em;color:var(--ink);margin-right:-.14em}
.len{font:400 14px/1 "Inter";letter-spacing:.46em;color:var(--gold);text-transform:uppercase;margin-top:22px;margin-right:-.46em}
.lyr{font:200 16px/1 "Inter";letter-spacing:.3em;color:var(--dim);margin-top:24px}
.laf{font:300 19px/1 "Noto Sans CJK SC";letter-spacing:.16em;color:rgba(236,233,226,.86);margin-top:30px}
.lafen{font:italic 400 18px/1 "TeX Gyre Pagella";color:var(--dim);margin-top:12px}
.mot{font:300 32px/1.4 "Noto Serif CJK SC";letter-spacing:.2em;color:var(--ink);margin-right:-.2em}
.moten{font:300 13px/1 "Inter";letter-spacing:.5em;color:var(--gold);text-transform:uppercase;margin-top:22px;margin-right:-.5em}
.prize{font:300 13px/1 "Inter";letter-spacing:.34em;color:var(--dim2);margin-top:20px;margin-right:-.34em}
.prizezh{font:300 16px/1 "Noto Sans CJK SC";letter-spacing:.3em;color:var(--dim);margin-top:26px;margin-right:-.3em}
.final{font:300 60px/1 "Noto Serif CJK SC";letter-spacing:.3em;color:var(--ink);margin-right:-.3em}
.finalen{font:italic 400 24px/1 "TeX Gyre Pagella";color:rgba(232,226,212,.72);letter-spacing:.04em;margin-top:24px}
.endc{font:400 12.5px/1 "Inter";letter-spacing:.5em;color:var(--gold);text-transform:uppercase;margin-right:-.5em}
.endn{font:300 12.5px/1 "Inter";letter-spacing:.42em;color:var(--dim);text-transform:uppercase;margin-top:16px;margin-right:-.42em}
.src{font:300 11px/1 "Noto Sans CJK SC";letter-spacing:.2em;color:rgba(226,229,238,.32)}
.wm{font:400 11px/1 "Inter";letter-spacing:.42em;color:rgba(226,229,238,.36);text-transform:uppercase}
.scalel{font:300 13px/1 "Inter";letter-spacing:.2em;color:var(--dim)}
.scopel{font:400 11px/1 "Inter";letter-spacing:.32em;color:var(--dim2);text-transform:uppercase}
.scopezh{font:300 13px/1 "Noto Sans CJK SC";letter-spacing:.2em;color:var(--dim)}
</style>
</head>
<body>
<canvas id="gl" width="3840" height="2160"></canvas>
<div id="ui"><svg id="svg" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script src="timeline.js"></script>
<script src="util.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="s_intro.js"></script>
<script src="s_alga.js"></script>
<script src="s_membrane.js"></script>
<script src="s_neuron.js"></script>
<script src="s_brain.js"></script>
<script src="s_finale.js"></script>
<script src="main.js"></script>
</body>
</html>
